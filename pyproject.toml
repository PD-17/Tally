[project]
name = "tally"
version = "0.1.0"
description = "Diligence Desk: every pitch-deck claim checked against records, inside a budget."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "python-dotenv>=1.0",
    "pypdf>=7.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
]

[project.scripts]
tally = "tally.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
