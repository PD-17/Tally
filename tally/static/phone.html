<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tally dial</title>
<style>
  :root { --bg: #f6f5f1; --card: #fff; --ink: #1d1c19; --muted: #6b6860; --line: #e3e0d8; --accent: #2f5bd3; --bad: #c0392b; --soft: #eef1fb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151513; --card: #1f1f1c; --ink: #ecebe6; --muted: #a09d94; --line: #34332e; --accent: #7c9cff; --bad: #ef6b5c; --soft: #262a38; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 17px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .big { font-size: 44px; font-weight: 700; margin: 18px 0 4px; }
  .gauge { height: 22px; background: var(--soft); border-radius: 11px; overflow: hidden; margin: 8px 0 4px; }
  .gauge div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  button { display: block; width: 100%; font: inherit; font-size: 20px; padding: 16px; margin-top: 14px; border: 0; border-radius: 10px; color: #fff; background: var(--accent); }
  button.danger { background: var(--bad); }
  .approval { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 14px; }
  .approval button { margin-top: 8px; padding: 12px; font-size: 17px; }
  #last { margin-top: 18px; font-size: 14px; }
</style>
</head>
<body>
<h1>Tally: you hold the budget</h1>
<p class="muted" id="who"></p>
<div class="big" id="spent">0.00</div>
<div class="muted">credits spent of <b id="limit">-</b></div>
<div class="gauge"><div id="bar"></div></div>
<div class="muted" id="left"></div>
<button id="halve">Halve the budget</button>
<button class="danger" id="kill">Stop everything</button>
<div id="approvals"></div>
<p class="muted" id="last"></p>

<script>
const $ = (id) => document.getElementById(id);
const runId = new URLSearchParams(location.search).get("run");
$("who").textContent = runId ? `Run ${runId}` : "Open this page from the QR code on the desk.";
const post = (path, body) => fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}) });

function draw(spent, limit) {
  $("spent").textContent = Number(spent).toFixed(2);
  $("limit").textContent = Number(limit).toFixed(2);
  $("bar").style.width = `${Math.min(100, (100 * spent) / Math.max(limit, 1e-9))}%`;
}

async function poll() {  // also covers the moments before the event stream connects
  const res = await fetch(`/api/jobs/${runId}/state`);
  if (!res.ok) return;
  const s = await res.json();
  draw(s.spent, s.limit);
  $("left").textContent = s.killed ? "Stopped." : `${Math.floor(s.seconds_left / 60)} min ${Math.floor(s.seconds_left % 60)} s left`;
}

if (runId) {
  poll(); setInterval(poll, 2000);
  const source = new EventSource(`/api/events?run_id=${encodeURIComponent(runId)}`);
  source.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (e.run_id !== runId) return;  // ignore the naive buyer's lane
    if (e.kind === "settled") { draw(e.spent, e.limit); $("last").textContent = `Paid ${e.credits.toFixed(2)} for ${e.endpoint}`; }
    if (e.kind === "cut") $("last").textContent = `Budget is now ${e.limit.toFixed(2)}`;
    if (e.kind === "done") $("last").textContent = `Finished: ${e.stop_reason}`;
    if (e.kind === "approval") askApproval(e);
  };
}
$("halve").onclick = () => post(`/api/jobs/${runId}/cut`, { factor: 0.5 }).then(poll);
$("kill").onclick = () => post(`/api/jobs/${runId}/kill`).then(poll);

function askApproval(e) {
  const box = document.createElement("div"); box.className = "approval";
  box.innerHTML = "<div></div><button>Approve</button><button class='danger'>Deny</button>";
  box.firstChild.textContent = `Approve ${e.credits.toFixed(2)} credits? ${e.reason}`;
  const [yes, no] = box.querySelectorAll("button");
  const answer = (approve) => post(`/api/jobs/${runId}/approvals/${e.binding}`, { approve }).finally(() => box.remove());
  yes.onclick = () => answer(true); no.onclick = () => answer(false);
  $("approvals").append(box);
}
</script>
</body>
</html>
